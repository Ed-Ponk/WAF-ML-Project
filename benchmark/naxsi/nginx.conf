# ══════════════════════════════════════════════════════════════════
# nginx.conf — NAXSI WAF (nginx + naxsi module)
#
# NAXSI corre como reverse proxy, inspeccionando todo el tráfico
# HTTP antes de enviarlo al backend dummy.
# ══════════════════════════════════════════════════════════════════

# ── Configuración global ─────────────────────────────────────────
# Nota: NAXSI se compila estáticamente en el binario de nginx
# (--add-module en el Dockerfile), no se carga como .so.
worker_processes auto;
pid /var/run/nginx.pid;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 1024;
    multi_accept on;
    use epoll;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Logging ─────────────────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'rt=$request_time';
    access_log /var/log/nginx/access.log main;

    # ── Performance ─────────────────────────────────────────────
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 100;
    client_max_body_size 10M;
    client_body_buffer_size 128k;

    # ── Proxy settings ─────────────────────────────────────────
    proxy_connect_timeout 10s;
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;
    proxy_buffer_size 4k;
    proxy_buffers 8 16k;
    proxy_busy_buffers_size 32k;

    # ── NAXSI configuration ──────────────────────────────────────
    # Incluir reglas de detección de ataques
    include /etc/nginx/naxsi.rules;

    # ── Server block ─────────────────────────────────────────────
    server {
        listen 80;
        server_name _;

        # ── Proxy reverse al backend dummy ─────────────────────
        location / {
            # ── NAXSI: habilitar motor de reglas ────────────────
            SecRulesEnabled;
            # URL interna para respuestas bloqueadas
            DeniedUrl "/RequestDenied";
            # Thresholds de score para cada categoría de ataque
            CheckRule "$SQL >= 8" BLOCK;
            CheckRule "$XSS >= 8" BLOCK;
            CheckRule "$CMD >= 8" BLOCK;
            CheckRule "$TRAVERSE >= 8" BLOCK;
            CheckRule "$CRLF >= 8" BLOCK;
            CheckRule "$UWA >= 4" BLOCK;

            proxy_pass http://dummy-backend:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ── Página de bloqueo NAXSI ────────────────────────────
        location /RequestDenied {
            internal;
            return 403;
            add_header Content-Type text/plain;
        }

        # ── Health check ───────────────────────────────────────
        location /health {
            access_log off;
            return 200 "OK";
            add_header Content-Type text/plain;
        }
    }
}
