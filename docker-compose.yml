services:
  # ── Base de datos WAF (PostgreSQL, telemetría + dashboard) ─────
  database:
    image: postgres:15-alpine
    container_name: waf-db
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
      - waf_db_data:/var/lib/postgresql/data
    networks:
      - waf-backend
    deploy:
      resources:
        limits:
          cpus: ${DB_CPU_LIMIT:-0.5}
          memory: ${DB_MEMORY_LIMIT:-512M}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Capa 2: Motor de Machine Learning
  ml-engine:
    build: ./ml-engine
    container_name: waf-ml-engine
    restart: unless-stopped
    expose:
      - "${ML_ENGINE_PORT:-8000}"
    networks:
      - waf-backend
      - pyme-security-net
    volumes:
      - ./ml-engine:/app
    command: uvicorn app:app --host 0.0.0.0 --port ${ML_ENGINE_PORT}
    depends_on:
      database:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://${DB_USER}:${DB_PASSWORD}@database:${DB_PORT}/${DB_NAME}
      - THRESHOLD_BLOCK=${THRESHOLD_BLOCK}
      - THRESHOLD_LOG=${THRESHOLD_LOG}
      - WAF_DEBUG=${WAF_DEBUG}
      # 0=fast path activado (tráfico GET limpio saltea inferencia ML)
      # 1=desactivado (cada request pasa por el ensemble - solo para benchmark)
      - WAF_BENCHMARK_MODE=0
      - JWT_SECRET=${JWT_SECRET}
      - BACKEND_ALLOWLIST=${BACKEND_ALLOWLIST:-http://pyme-php-backend:80}
    deploy:
      resources:
        limits:
          cpus: ${ML_CPU_LIMIT:-1.0}
          memory: ${ML_MEMORY_LIMIT}
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:${ML_ENGINE_PORT}/health', timeout=5)",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 50s

  # Capa 1: Reverse Proxy (Nginx) con terminación TLS
  proxy:
    build: ./nginx
    container_name: waf-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./certs:/etc/nginx/certs/
      - ./nginx/403.html:/usr/share/nginx/html/403.html:ro
      - ./nginx/pyme_index.html:/usr/share/nginx/html/pyme/pyme_index.html:ro
      - ./nginx/default.conf.template:/etc/nginx/conf.d/default.conf.template:ro
      - certbot-etc:/etc/letsencrypt:ro
      - certbot-webroot:/var/www/certbot:ro
    networks:
      - waf-frontend
      - waf-backend
      - pyme-security-net
    # Espera que TODOS los upstreams estén saludables antes de arrancar:
    # nginx resuelve los hostnames de proxy_pass al iniciar y muere si no
    # existen (race de arranque clásico). service_healthy lo elimina.
    depends_on:
      ml-engine:
        condition: service_healthy
      waf-dashboard:
        condition: service_healthy
      pyme-react-frontend:
        condition: service_healthy
    environment:
      - WAF_ENV=${WAF_ENV:-development}
      - WAF_DOMAIN=${WAF_DOMAIN:-localhost}
      - PYME_DOMAIN=${PYME_DOMAIN:-pyme.waf.local}
      - ADMIN_DOMAIN=${ADMIN_DOMAIN:-admin.waf.local}
      - CERT_PATH=${CERT_PATH:-/etc/nginx/certs/waf.crt}
      - KEY_PATH=${KEY_PATH:-/etc/nginx/certs/waf.key}
    deploy:
      resources:
        limits:
          cpus: ${PROXY_CPU_LIMIT:-0.5}
          memory: ${PROXY_MEMORY_LIMIT:-256M}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/ >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Certificate sidecar — Let's Encrypt (HTTP-01 + webroot compartido).
  # En modo dev (sin ACME_PRIMARY_DOMAIN) el entrypoint hace idle y el
  # proxy usa autofirmados de ./certs.
  certbot:
    image: certbot/certbot:2
    container_name: waf-certbot
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    volumes:
      - ./nginx/certbot-entrypoint.sh:/entrypoint.sh:ro
      - certbot-etc:/etc/letsencrypt
      - certbot-webroot:/var/www/certbot
    environment:
      - ACME_EMAIL=${ACME_EMAIL:-}
      - ACME_PRIMARY_DOMAIN=${ACME_PRIMARY_DOMAIN:-}
      - ACME_EXTRA_DOMAINS=${ACME_EXTRA_DOMAINS:-}
    networks:
      - waf-frontend
    depends_on:
      proxy:
        condition: service_healthy

  # ── Capa 0a: PYME React Frontend ──────────────────────────────────
  pyme-react-frontend:
    build:
      context: ../../thesis/app-pyme/atel-front
    container_name: pyme-react-frontend
    restart: unless-stopped
    networks:
      - pyme-security-net
    environment:
      - VITE_LINK_BACKEND=/api/v1
    deploy:
      resources:
        limits:
          cpus: ${PYME_FRONT_CPU_LIMIT:-0.5}
          memory: ${PYME_FRONT_MEMORY_LIMIT:-512M}
    # NO ports exposed — traffic enters through proxy only (R1)
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5173/ >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── Capa 0b: PYME PHP Backend (+ su base de datos MySQL) ────────
  # MySQL aislado en la red pyme; credencial SOLO vía env (fail-closed:
  # sin MYSQL_ROOT_PASSWORD el stack no levanta). El proxy es la única
  # puerta de entrada a este backend (R1/R6).
  mysql:
    image: mysql:8.0
    container_name: waf-pyme-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?}
      MYSQL_DATABASE: bd_atel
    volumes:
      - pyme_mysql_data:/var/lib/mysql
    networks:
      - pyme-security-net
    deploy:
      resources:
        limits:
          cpus: ${MYSQL_CPU_LIMIT:-0.5}
          memory: ${MYSQL_MEMORY_LIMIT:-512M}
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 5

  pyme-php-backend:
    build:
      context: ../../thesis/app-pyme/atel-back
    container_name: pyme-php-backend
    restart: unless-stopped
    networks:
      - pyme-security-net
    environment:
      - DB_CONNECTION=${DB_MYSQL_CONNECTION}
      - DB_HOST=${DB_MYSQL_HOST}
      - DB_PORT=${DB_MYSQL_PORT}
      - DB_DATABASE=${DB_MYSQL_DATABASE}
      - DB_USERNAME=${DB_MYSQL_USERNAME}
      - DB_PASSWORD=${DB_MYSQL_PASSWORD}
    depends_on:
      mysql:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: ${PYME_PHP_CPU_LIMIT:-0.5}
          memory: ${PYME_PHP_MEMORY_LIMIT:-256M}
    # NO ports directive — backend is NOT exposed to host (R1/R6)

  # ── Capa 0c: WAF Admin Dashboard (Next.js) ────────────────────────
  waf-dashboard:
    build:
      context: ./dashboard
    container_name: waf-dashboard
    restart: unless-stopped
    networks:
      - waf-backend
    volumes:
      - ./ml-engine:/ml-engine
    depends_on:
      database:
        condition: service_healthy
      ml-engine:
        condition: service_healthy
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_HOST=database
      - POSTGRES_PORT=${DB_PORT}
      - DATABASE_URL=postgresql://${DB_USER}:${DB_PASSWORD}@database:${DB_PORT}/${DB_NAME}
      - ML_ENGINE_URL=http://ml-engine:8000
      - JWT_SECRET=${JWT_SECRET}
      - COOKIE_SECURE=${COOKIE_SECURE:-false}
    deploy:
      resources:
        limits:
          cpus: ${DASHBOARD_CPU_LIMIT:-0.5}
          memory: ${DASHBOARD_MEMORY_LIMIT:-768M}
    # Liveness via la raiz con basePath (basePath: /dashboard en next.config.js).
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:3000/dashboard/ >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ── VPN WireGuard — canal de administración remota ────────────────
  # Se mantiene PUBLICADO (55555:51820/udp) a propósito: es la vía de
  # acceso admin al VPS (SSH/panel cerrados a internet). No exponer la
  # app por otros puertos: solo nginx 80/443 hacia internet.
  vpn:
    image: lscr.io/linuxserver/wireguard:latest
    container_name: waf-vpn
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ}
      - SERVERURL=auto
      - PEERS=1 # Genera 1 cliente (puedes poner 'admin,trabajador1')
      - PEERDNS=auto
    ports:
      - "55555:51820/udp"
    volumes:
      - ./config/vpn:/config
    networks:
      - waf-frontend
      - waf-backend
    deploy:
      resources:
        limits:
          cpus: ${VPN_CPU_LIMIT:-0.25}
          memory: ${VPN_MEMORY_LIMIT:-128M}
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1

  # Backend simulado PYME — app web de prueba (Si se logra integrar el WAF con la app pyme, entonces comentar todo este servicio)
  #pyme-app-back:
  #image: nginx:alpine
  #container_name: waf-pyme-back
  #volumes:
  # - ./nginx/pyme_index.html:/usr/share/nginx/html/index.html:ro
  #networks:
  # - waf-backend

networks:
  waf-frontend:
    driver: bridge
  waf-backend:
    driver: bridge
  pyme-security-net:
    driver: bridge
    name: pyme-security-net

volumes:
  waf_db_data:
  pyme_mysql_data:
  certbot-etc:
  certbot-webroot: