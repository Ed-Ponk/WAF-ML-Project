# Rotación de logs reutilizable (evita que json-file llene el disco del VPS)
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ── Base de datos WAF (PostgreSQL, telemetría + dashboard) ─────
  # NOTA: init.sql solo se ejecuta cuando el volumen waf_db_data se crea por
  # primera vez. Cambios posteriores requieren migraciones manuales.
  database:
    image: postgres:15-alpine
    container_name: waf-db
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_USER: ${DB_USER:?DB_USER no esta definida en .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD no esta definida en .env}
      POSTGRES_DB: ${DB_NAME:?DB_NAME no esta definida en .env}
    volumes:
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
      - waf_db_data:/var/lib/postgresql/data
    networks:
      - waf-backend
    deploy:
      resources:
        limits:
          cpus: ${DB_CPU_LIMIT:-0.5}
          memory: ${DB_MEMORY_LIMIT:-512M}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Migraciones one-shot (schema_migrations) ────────────────────
  # Se ejecuta en cada `docker compose up`, aplica solo lo pendiente y termina.
  # ml-engine y waf-dashboard esperan a que salga con código 0.
  migrate:
    image: postgres:15-alpine
    container_name: waf-migrate
    restart: "no"
    logging: *default-logging
    networks:
      - waf-backend
    depends_on:
      database:
        condition: service_healthy
    environment:
      - PGHOST=database
      - PGPORT=${DB_PORT:-5432}
      - PGUSER=${DB_USER:?DB_USER no esta definida en .env}
      - PGPASSWORD=${DB_PASSWORD:?DB_PASSWORD no esta definida en .env}
      - PGDATABASE=${DB_NAME:?DB_NAME no esta definida en .env}
      - MIGRATE_MODE=container
      - MIGRATIONS_DIR=/database/migrations
    volumes:
      - ./scripts/apply-migrations.sh:/scripts/apply-migrations.sh:ro
      - ./database/migrations:/database/migrations:ro
    entrypoint: ["/bin/sh", "/scripts/apply-migrations.sh"]

  # Capa 2: Motor de Machine Learning
  ml-engine:
    build: ./ml-engine
    container_name: waf-ml-engine
    restart: unless-stopped
    logging: *default-logging
    expose:
      - "${ML_ENGINE_PORT:-8000}"
    networks:
      - waf-backend
      - pyme-security-net
    # TODO: montar todo el código fuente sobre /app es práctico en desarrollo,
    # pero en producción anula el COPY del Dockerfile. Valorar montar solo
    # la carpeta de modelos o un volumen nombrado.
    volumes:
      - ./ml-engine:/app
    command: uvicorn app:app --host 0.0.0.0 --port ${ML_ENGINE_PORT:-8000}
    depends_on:
      database:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      - DATABASE_URL=postgresql://${DB_USER}:${DB_PASSWORD}@database:${DB_PORT:-5432}/${DB_NAME}
      - THRESHOLD_BLOCK=${THRESHOLD_BLOCK:?THRESHOLD_BLOCK no esta definida en .env}
      - THRESHOLD_LOG=${THRESHOLD_LOG:?THRESHOLD_LOG no esta definida en .env}
      - WAF_DEBUG=${WAF_DEBUG:-0}
      # 0=fast path activado (tráfico GET limpio saltea inferencia ML)
      # 1=desactivado (cada request pasa por el ensemble - solo para benchmark)
      - WAF_BENCHMARK_MODE=0
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET no esta definida en .env}
      - BACKEND_ALLOWLIST=${BACKEND_ALLOWLIST:-http://pyme-php-backend:80,http://maderera-app:3000}
    deploy:
      resources:
        limits:
          cpus: ${ML_CPU_LIMIT:-1.0}
          memory: ${ML_MEMORY_LIMIT:-1G}
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:${ML_ENGINE_PORT:-8000}/health', timeout=5)",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 50s

  # Capa 1: Reverse Proxy (Nginx) con terminación TLS
  proxy:
    build: ./nginx
    container_name: waf-proxy
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./certs:/etc/nginx/certs/
      - ./nginx/403.html:/usr/share/nginx/html/403.html:ro
      - ./nginx/pyme_index.html:/usr/share/nginx/html/pyme/pyme_index.html:ro
      - ./nginx/default.conf.template:/etc/nginx/conf.d/default.conf.template:ro
      - certbot-etc:/etc/letsencrypt:ro
      - certbot-webroot:/var/www/certbot:ro
    networks:
      - waf-frontend
      - waf-backend
      - pyme-security-net
    # Espera que TODOS los upstreams estén saludables antes de arrancar:
    # nginx resuelve los hostnames de proxy_pass al iniciar y muere si no
    # existen (race de arranque clásico). service_healthy lo elimina.
    depends_on:
      ml-engine:
        condition: service_healthy
      waf-dashboard:
        condition: service_healthy
      pyme-react-frontend:
        condition: service_healthy
      pyme-php-backend:
        condition: service_healthy
      maderera-app:
        condition: service_healthy
    environment:
      - WAF_ENV=${WAF_ENV:-development}
      - WAF_DOMAIN=${WAF_DOMAIN:-localhost}
      - PYME_DOMAIN=${PYME_DOMAIN:-pyme.waf.local}
      - ADMIN_DOMAIN=${ADMIN_DOMAIN:-admin.waf.local}
      - MADERERA_DOMAIN=${MADERERA_DOMAIN:-maderera.theedudev.com}
      - CERT_PATH=${CERT_PATH:-/etc/nginx/certs/waf.crt}
      - KEY_PATH=${KEY_PATH:-/etc/nginx/certs/waf.key}
    deploy:
      resources:
        limits:
          cpus: ${PROXY_CPU_LIMIT:-0.5}
          memory: ${PROXY_MEMORY_LIMIT:-256M}
    healthcheck:
      test:
        ["CMD-SHELL", "wget -qO- http://localhost/ >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Certificate sidecar — Let's Encrypt (HTTP-01 + webroot compartido).
  # En modo dev (sin ACME_PRIMARY_DOMAIN) el entrypoint hace idle y el
  # proxy usa autofirmados de ./certs.
  certbot:
    # Detras de profile: no levanta en el stack por defecto. Uso: docker compose --profile certbot up -d
    image: certbot/certbot:v5.8.0
    profiles: ["certbot"]
    container_name: waf-certbot
    logging: *default-logging
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    volumes:
      - ./nginx/certbot-entrypoint.sh:/entrypoint.sh:ro
      - certbot-etc:/etc/letsencrypt
      - certbot-webroot:/var/www/certbot
    environment:
      - ACME_EMAIL=${ACME_EMAIL:-}
      - ACME_PRIMARY_DOMAIN=${ACME_PRIMARY_DOMAIN:-}
      - ACME_EXTRA_DOMAINS=${ACME_EXTRA_DOMAINS:-}
    networks:
      - waf-frontend
    depends_on:
      proxy:
        condition: service_healthy

  # ── Capa 0a: PYME React Frontend ──────────────────────────────────
  # Los contextos de build ../../atel-upload/* dependen de la estructura de
  # carpetas del VPS. Documentar en el README o pasar a submódulos git.
  pyme-react-frontend:
    build:
      context: ${ATEL_UPLOAD_DIR:-../../atel-upload}/atel-front
    container_name: pyme-react-frontend
    restart: unless-stopped
    logging: *default-logging
    networks:
      - pyme-security-net
    environment:
      - VITE_LINK_BACKEND=/api/v1
    deploy:
      resources:
        limits:
          cpus: ${PYME_FRONT_CPU_LIMIT:-0.5}
          memory: ${PYME_FRONT_MEMORY_LIMIT:-512M}
    # NO ports exposed — traffic enters through proxy only (R1)
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5173/ >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── Maderera (Next.js) ────────────────────────────────────────────
  # TODO seguridad: comparte la base Postgres del WAF con las mismas
  # credenciales. Ideal: base/rol dedicado con permisos limitados.
  maderera-app:
    build:
      context: ${ATEL_UPLOAD_DIR:-../../atel-upload}/projecto_landing
    container_name: waf-maderera-app
    restart: unless-stopped
    logging: *default-logging
    expose:
      - "3000"
    networks:
      - waf-frontend
      - waf-backend
    environment:
      - DATABASE_URL=postgresql://${DB_USER}:${DB_PASSWORD}@database:${DB_PORT:-5432}/${DB_NAME}
      - AUTH_SECRET=${MADERERA_AUTH_SECRET:?MADERERA_AUTH_SECRET no esta definida en .env}
      - NEXT_PUBLIC_SITE_URL=https://${MADERERA_DOMAIN:-maderera.theedudev.com}
      - AUTH_TRUST_HOST=true
      - AUTH_URL=https://${MADERERA_DOMAIN:-maderera.theedudev.com}
    depends_on:
      database:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: ${MADERERA_CPU_LIMIT:-0.5}
          memory: ${MADERERA_MEMORY_LIMIT:-768M}
    # Usa node (ya presente en la imagen) para no depender de wget/curl.
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:3000/',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ── Capa 0b: PYME PHP Backend (+ su base de datos MySQL) ────────
  # MySQL aislado en la red pyme; credencial SOLO vía env (fail-closed:
  # sin MYSQL_ROOT_PASSWORD el stack no levanta). El proxy es la única
  # puerta de entrada a este backend (R1/R6).
  # TODO: MySQL 8.0 llegó a fin de vida (abril 2026). Planear migración a
  # 8.4 LTS con backup previo del volumen pyme_mysql_data.
  mysql:
    image: mysql:8.0
    container_name: waf-pyme-db
    restart: unless-stopped
    logging: *default-logging
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?}
      MYSQL_DATABASE: bd_atel
    volumes:
      - pyme_mysql_data:/var/lib/mysql
    networks:
      - pyme-security-net
    deploy:
      resources:
        limits:
          cpus: ${MYSQL_CPU_LIMIT:-0.5}
          memory: ${MYSQL_MEMORY_LIMIT:-512M}
    # MYSQL_PWD evita exponer la contraseña como argumento en la lista de procesos.
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysqladmin ping -h localhost -uroot --silent",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  pyme-php-backend:
    build:
      context: ${ATEL_UPLOAD_DIR:-../../atel-upload}/atel-back
    container_name: pyme-php-backend
    restart: unless-stopped
    logging: *default-logging
    networks:
      - pyme-security-net
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - APP_KEY=${PYME_APP_KEY:?PYME_APP_KEY no esta definida en .env}
      - PASSPORT_PRIVATE_KEY=${PYME_PASSPORT_PRIVATE_KEY:?PYME_PASSPORT_PRIVATE_KEY no esta definida en .env}
      - PASSPORT_PUBLIC_KEY=${PYME_PASSPORT_PUBLIC_KEY:?PYME_PASSPORT_PUBLIC_KEY no esta definida en .env}
      - DB_CONNECTION=${DB_MYSQL_CONNECTION:-mysql}
      - DB_HOST=${DB_MYSQL_HOST:-mysql}
      - DB_PORT=${DB_MYSQL_PORT:-3306}
      - DB_DATABASE=${DB_MYSQL_DATABASE:-bd_atel}
      - DB_USERNAME=${DB_MYSQL_USERNAME:?DB_MYSQL_USERNAME no esta definida en .env}
      - DB_PASSWORD=${DB_MYSQL_PASSWORD:?DB_MYSQL_PASSWORD no esta definida en .env}
    depends_on:
      mysql:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: ${PYME_PHP_CPU_LIMIT:-0.5}
          memory: ${PYME_PHP_MEMORY_LIMIT:-256M}
    # Comprueba que el puerto 80 acepte conexiones usando el CLI de PHP.
    # Si la imagen no incluye php CLI o escucha en otro puerto, ajustar.
    healthcheck:
      test:
        [
          "CMD",
          "php",
          "-r",
          "exit(@fsockopen('127.0.0.1', 80) ? 0 : 1);",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    # NO ports directive — backend is NOT exposed to host (R1/R6)

  # ── Capa 0c: WAF Admin Dashboard (Next.js) ────────────────────────
  waf-dashboard:
    build:
      context: ./dashboard
    container_name: waf-dashboard
    restart: unless-stopped
    logging: *default-logging
    networks:
      - waf-backend
    volumes:
      - ./ml-engine:/ml-engine
    depends_on:
      database:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      ml-engine:
        condition: service_healthy
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_HOST=database
      - POSTGRES_PORT=${DB_PORT:-5432}
      - DATABASE_URL=postgresql://${DB_USER}:${DB_PASSWORD}@database:${DB_PORT:-5432}/${DB_NAME}
      - ML_ENGINE_URL=http://ml-engine:${ML_ENGINE_PORT:-8000}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET no esta definida en .env}
      # Default seguro: en producción hay TLS. En desarrollo sobre http
      # definir COOKIE_SECURE=false en .env.
      - COOKIE_SECURE=${COOKIE_SECURE:-true}
    deploy:
      resources:
        limits:
          cpus: ${DASHBOARD_CPU_LIMIT:-0.5}
          memory: ${DASHBOARD_MEMORY_LIMIT:-768M}
    # Liveness via la raiz con basePath (basePath: /dashboard en next.config.js).
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --spider -q http://127.0.0.1:3000/dashboard/ >/dev/null 2>&1 || exit 1",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ── VPN WireGuard — canal de administración remota ────────────────
  # Se mantiene PUBLICADO (55555:51820/udp) a propósito: es la vía de
  # acceso admin al VPS (SSH/panel cerrados a internet). No exponer la
  # app por otros puertos: solo nginx 80/443 hacia internet.
  # Fijar versión en .env (WIREGUARD_IMAGE) para builds reproducibles.
  vpn:
    image: ${WIREGUARD_IMAGE:-lscr.io/linuxserver/wireguard:latest}
    container_name: waf-vpn
    restart: unless-stopped
    logging: *default-logging
    # SYS_MODULE eliminado: el kernel del host ya trae WireGuard.
    # Si el contenedor falla al crear la interfaz, restituirlo.
    cap_add:
      - NET_ADMIN
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ:-UTC}
      - SERVERURL=auto
      - PEERS=1 # Genera 1 cliente (puedes poner 'admin,trabajador1')
      - PEERDNS=auto
    ports:
      - "55555:51820/udp"
    volumes:
      - ./config/vpn:/config
    # Solo waf-backend (dashboard/ml-engine). Ya no ve waf-frontend.
    networks:
      - waf-backend
    deploy:
      resources:
        limits:
          cpus: ${VPN_CPU_LIMIT:-0.25}
          memory: ${VPN_MEMORY_LIMIT:-128M}
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1

networks:
  waf-frontend:
    driver: bridge
  waf-backend:
    driver: bridge
  pyme-security-net:
    driver: bridge
    name: pyme-security-net

volumes:
  waf_db_data:
  pyme_mysql_data:
  certbot-etc:
  certbot-webroot:
