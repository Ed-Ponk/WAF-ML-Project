# ══════════════════════════════════════════════════════════════════
# default.conf — Proxy Reverso Nginx con terminación TLS
#
# Capa 1 del WAF-ML Híbrido.
#   - Puerto 443:  HTTPS con certificado autofirmado (dev)
#   - Puerto 80:   HTTP plano (útil para healthchecks internos)
#
# Flujo TLS (MitM legítimo):
#   Cliente → HTTPS :443 → Nginx descifra → HTTP plano → Backend
# ══════════════════════════════════════════════════════════════════

# ── HTTP — tráfico entrante sin TLS (dev, healthchecks) ────────
server {
    listen 80;
    listen [::]:80;

    # ── Timeouts adaptativos ──────────────────────────────────
    proxy_connect_timeout 10s;
    proxy_read_timeout    30s;
    proxy_send_timeout    30s;

    # ── Error catchment (server-level) ────────────────────────
    error_page 500 502 503 504 =200 /pyme/pyme_index.html;

    # ══════════════════════════════════════════════════════════
    # STATIC ASSETS — Frontend SPA (NO ML check)
    # ══════════════════════════════════════════════════════════
    location / {
        proxy_pass http://pyme-react-frontend:5173;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ══════════════════════════════════════════════════════════
    # ADMIN DASHBOARD — Next.js administrative dashboard (Fase 2)
    # ══════════════════════════════════════════════════════════
    location /dashboard {
        auth_request off;

        proxy_pass http://waf-dashboard:3000;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support for Next.js fast-refresh and telemetry sockets
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # ══════════════════════════════════════════════════════════
    # API TRAFFIC — WAF validation then PHP backend
    # ══════════════════════════════════════════════════════════
    location /api/ {
        auth_request /validate;

        proxy_pass_request_body on;

        error_page 403 =403 /403.html;

        proxy_pass http://pyme-php-backend:80;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header X-Original-Method $request_method;
    }

    # ══════════════════════════════════════════════════════════
    # VALIDACIÓN WAF — Motor ML interno
    # ══════════════════════════════════════════════════════════
    location = /validate {
        internal;

        error_page 500 502 503 504 =403 /403.html;

        proxy_pass http://ml-engine:8000/waf_core;

        proxy_pass_request_body on;
        proxy_set_header Content-Length $content_length;
        proxy_set_header X-Original-URI    $request_uri;
        proxy_set_header X-Original-Method $request_method;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header Content-Type      $content_type;

        proxy_connect_timeout 5s;
        proxy_read_timeout    10s;

        client_max_body_size 10M;
        client_body_buffer_size 128k;
    }

    # ══════════════════════════════════════════════════════════
    # PÁGINAS DE ERROR
    # ══════════════════════════════════════════════════════════
    location = /403.html {
        root /usr/share/nginx/html;
    }

    location = /pyme/pyme_index.html {
        alias /usr/share/nginx/html/pyme/pyme_index.html;
    }
}

# ── HTTPS — tráfico entrante TLS (proxy reverso con WAF) ───────
server {
    listen 443 ssl;
    listen [::]:443 ssl;

    # ── Certificados TLS autogenerados ─────────────────────────
    ssl_certificate     /etc/nginx/certs/waf.crt;
    ssl_certificate_key /etc/nginx/certs/waf.key;

    # ── Configuración SSL recomendada para desarrollo ──────────
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # ── Timeouts adaptativos ──────────────────────────────────
    proxy_connect_timeout 10s;
    proxy_read_timeout    30s;
    proxy_send_timeout    30s;

    # ── Error catchment (server-level) ────────────────────────
    error_page 500 502 503 504 =200 /pyme/pyme_index.html;

    # ══════════════════════════════════════════════════════════
    # STATIC ASSETS — Frontend SPA (NO ML check)
    # ══════════════════════════════════════════════════════════
    location / {
        proxy_pass http://pyme-react-frontend:5173;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ══════════════════════════════════════════════════════════
    # ADMIN DASHBOARD — Next.js administrative dashboard (Fase 2)
    # ══════════════════════════════════════════════════════════
    location /dashboard {
        auth_request off;

        proxy_pass http://waf-dashboard:3000;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support for Next.js fast-refresh and telemetry sockets
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # ══════════════════════════════════════════════════════════
    # API TRAFFIC — WAF validation then PHP backend
    # ══════════════════════════════════════════════════════════
    location /api/ {
        auth_request /validate;

        proxy_pass_request_body on;

        error_page 403 =403 /403.html;

        # Proxy al backend en TEXTO PLANO (ya descifrado por Nginx)
        proxy_pass http://pyme-php-backend:80;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header X-Original-Method $request_method;
    }

    # ══════════════════════════════════════════════════════════
    # VALIDACIÓN WAF — Motor ML interno
    # ══════════════════════════════════════════════════════════
    location = /validate {
        internal;

        error_page 500 502 503 504 =403 /403.html;

        # WAF Engine recibe tráfico en texto plano (ya descifrado)
        proxy_pass http://ml-engine:8000/waf_core;

        proxy_pass_request_body on;
        proxy_set_header Content-Length $content_length;
        proxy_set_header X-Original-URI    $request_uri;
        proxy_set_header X-Original-Method $request_method;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header Content-Type      $content_type;

        proxy_connect_timeout 5s;
        proxy_read_timeout    10s;

        client_max_body_size 10M;
        client_body_buffer_size 128k;
    }

    # ══════════════════════════════════════════════════════════
    # PÁGINAS DE ERROR
    # ══════════════════════════════════════════════════════════
    location = /403.html {
        root /usr/share/nginx/html;
    }

    location = /pyme/pyme_index.html {
        alias /usr/share/nginx/html/pyme/pyme_index.html;
    }
}
