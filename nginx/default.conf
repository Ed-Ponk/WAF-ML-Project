# ══════════════════════════════════════════════════════════════════
# default.conf — Proxy Reverso Nginx con terminación TLS
#
# Capa 1 del WAF-ML Híbrido.
#   - Puerto 443:  HTTPS con certificado autofirmado (dev)
#   - Puerto 80:   HTTP plano (útil para healthchecks internos)
#
# Flujo TLS (MitM legítimo):
#   Cliente → HTTPS :443 → Nginx descifra → HTTP plano → Backend
# ══════════════════════════════════════════════════════════════════

# ══════════════════════════════════════════════════════════════════
# WAF-ML PROXY — Ruteo por subdominios y por ruta
#
# Acceso vía subdominio (recomendado):
#   http://admin.waf.local        → WAF Admin Dashboard (Next.js)
#   http://pyme.waf.local         → PYME Frontend SPA
#
# Acceso vía ruta (compatibilidad):
#   http://localhost/dashboard    → WAF Admin Dashboard
#   http://localhost/             → PYME Frontend
# ══════════════════════════════════════════════════════════════════

# ── HTTP: PYME Frontend + API legado ────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name localhost pyme.waf.local;

    # ── Timeouts adaptativos ──────────────────────────────────
    proxy_connect_timeout 10s;
    proxy_read_timeout    30s;
    proxy_send_timeout    30s;

    # ── Error catchment (server-level) ────────────────────────
    error_page 500 502 503 504 =200 /pyme/pyme_index.html;

    # ══════════════════════════════════════════════════════════
    # STATIC ASSETS — Frontend SPA (NO ML check)
    # ══════════════════════════════════════════════════════════
    location / {
        proxy_pass http://pyme-react-frontend:5173;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ══════════════════════════════════════════════════════════
    # ADMIN DASHBOARD — vía ruta /dashboard (compatibilidad localhost)
    # ══════════════════════════════════════════════════════════
    location /dashboard {
        auth_request off;

        proxy_pass http://waf-dashboard:3000;

        # ── HTTP Security Headers (dashboard only) ─────────────
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support for Next.js fast-refresh and telemetry sockets
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # ══════════════════════════════════════════════════════════
    # API TRAFFIC — WAF-ML proxy (decide BLOCK o reenvía al backend)
    # ══════════════════════════════════════════════════════════
    # El ml-engine recibe el request COMPLETO (con body), lo inspecciona,
    # y si es seguro, lo reenvía al backend PHP. Si es ataque, devuelve 403.
    location /api/ {
        proxy_pass http://ml-engine:8000;
        proxy_pass_request_body on;

        error_page 403 =403 /403.html;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header X-Original-Method $request_method;
        proxy_set_header X-Backend http://pyme-php-backend:80;

        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;

        client_max_body_size 10M;
        client_body_buffer_size 128k;
    }

    # ══════════════════════════════════════════════════════════
    # PÁGINAS DE ERROR
    # ══════════════════════════════════════════════════════════
    location = /403.html {
        root /usr/share/nginx/html;
    }

    location = /pyme/pyme_index.html {
        alias /usr/share/nginx/html/pyme/pyme_index.html;
    }
}

# ── HTTP: WAF Admin Dashboard por subdominio ────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name admin.waf.local;

    # ── Timeouts ──────────────────────────────────────────────
    proxy_connect_timeout 10s;
    proxy_read_timeout    30s;
    proxy_send_timeout    30s;

    location / {
        auth_request off;

        # Prepend /dashboard for Next.js basePath.
        # If URL already has /dashboard prefix (from Next.js redirect), proxy as-is
        # to avoid double /dashboard/dashboard/ paths.
        # Matches both /dashboard and /dashboard/* (with or without trailing path)
        rewrite ^/(dashboard(/.*)?)$ /$1 break;
        rewrite ^/(.*)$ /dashboard/$1 break;
        proxy_pass http://waf-dashboard:3000;

        # ── HTTP Security Headers (dashboard only) ─────────────
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# ── HTTPS: PYME Frontend + API legado ──────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name localhost pyme.waf.local;

    # ── Certificados TLS autogenerados ─────────────────────────
    ssl_certificate     /etc/nginx/certs/waf.crt;
    ssl_certificate_key /etc/nginx/certs/waf.key;

    # ── Configuración SSL recomendada para desarrollo ──────────
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # ── Timeouts adaptativos ──────────────────────────────────
    proxy_connect_timeout 10s;
    proxy_read_timeout    30s;
    proxy_send_timeout    30s;

    # ── Error catchment (server-level) ────────────────────────
    error_page 500 502 503 504 =200 /pyme/pyme_index.html;

    # ══════════════════════════════════════════════════════════
    # STATIC ASSETS — Frontend SPA (NO ML check)
    # ══════════════════════════════════════════════════════════
    location / {
        proxy_pass http://pyme-react-frontend:5173;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ══════════════════════════════════════════════════════════
    # ADMIN DASHBOARD — vía ruta /dashboard (compatibilidad)
    # ══════════════════════════════════════════════════════════
    location /dashboard {
        auth_request off;

        proxy_pass http://waf-dashboard:3000;

        # ── HTTP Security Headers (dashboard only) ─────────────
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header Strict-Transport-Security "max-age=31536000" always;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # ══════════════════════════════════════════════════════════
    # API TRAFFIC — WAF-ML proxy (decide BLOCK o reenvía al backend)
    # ══════════════════════════════════════════════════════════
    location /api/ {
        proxy_pass http://ml-engine:8000;
        proxy_pass_request_body on;

        error_page 403 =403 /403.html;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header X-Original-Method $request_method;
        proxy_set_header X-Backend http://pyme-php-backend:80;

        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;

        client_max_body_size 10M;
        client_body_buffer_size 128k;
    }

    # ══════════════════════════════════════════════════════════
    # PÁGINAS DE ERROR
    # ══════════════════════════════════════════════════════════
    location = /403.html {
        root /usr/share/nginx/html;
    }

    location = /pyme/pyme_index.html {
        alias /usr/share/nginx/html/pyme/pyme_index.html;
    }
}

